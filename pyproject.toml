[project]
name = "hamsafar-rag-demo"
version = "0.1.0"
description = "Persian travel RAG and sourced trip quotation assistant"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "qdrant-client>=1.14,<2",
  "sqlglot>=26,<31",
  "rank-bm25==0.2.2",
  "httpx>=0.28,<1",
  "streamlit>=1.40,<2",
  "langfuse>=3,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
